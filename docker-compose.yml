version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rag-eval-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=rag_evaluation
    volumes:
      - mongodb_data:/data/db
    networks:
      - rag-eval-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-eval-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=rag_evaluation
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-development_jwt_secret_key_rag_evaluation_platform_2026}
      - CORS_ORIGINS=http://localhost:4200,http://127.0.0.1:4200,http://localhost:80,http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rag-eval-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-eval-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag-eval-network

volumes:
  mongodb_data:
    driver: local

networks:
  rag-eval-network:
    driver: bridge

